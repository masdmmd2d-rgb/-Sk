<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Учёт товаров</title>
    <style>
        body { 
            margin: 0;
            padding: 20px;
            background-color: #121212;
            color: #fff; 
            font-family: sans-serif; 
            min-height: 100vh;
            box-sizing: border-box;
        }

        h2 { margin-top: 0; }

        .top-container {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .stats { display: flex; gap: 20px; flex-wrap: wrap; }
        
        .card { 
            background: #1e1e1e; 
            padding: 15px 25px; 
            border-radius: 8px; 
            min-width: 150px; 
            border: 1px solid #2d2d2d;
        }
        .card div { font-size: 14px; color: #aaa; margin-bottom: 5px; }
        .card h3 { margin: 0; font-size: 24px; font-weight: bold; }

        .calc-card {
            background: #1e1e1e;
            padding: 15px 20px;
            border-radius: 8px;
            border: 1px solid #2d2d2d;
            min-width: 300px;
            flex: 1;
            max-width: 450px;
        }
        .calc-title { font-size: 14px; color: #aaa; margin-bottom: 10px; font-weight: bold; }
        .calc-inputs { display: flex; gap: 8px; align-items: center; }
        .calc-inputs input { width: 80px; }
        .calc-result { margin-top: 10px; font-size: 15px; color: #e74c3c; font-weight: bold; min-height: 18px; }

        .controls-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .form-group { display: flex; gap: 10px; flex-wrap: wrap; }
        .backup-group { display: flex; gap: 10px; flex-wrap: wrap; }
        
        input, select { 
            background: #1e1e1e; 
            border: 1px solid #444; 
            color: #fff; 
            padding: 8px 12px; 
            border-radius: 6px; 
            outline: none;
        }
        input:focus, select:focus { border-color: #2ecc71; }

        button { 
            background: #2ecc71; 
            border: none; 
            color: white; 
            padding: 8px 16px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold;
        }
        button:hover { background: #27ae60; }
        
        button.backup-btn { background: #34495e; }
        button.backup-btn:hover { background: #2c3e50; }

        .delete-btn { 
            background: rgba(231, 76, 60, 0.1); 
            border: 1px solid #e74c3c;
            color: #e74c3c;
            padding: 4px 10px; 
            font-size: 13px; 
            border-radius: 4px;
            cursor: pointer;
        }
        button.delete-btn:hover { background: #e74c3c; color: white; }

        #backupFileInput { display: none; }

        .table-container {
            background: #1e1e1e;
            border-radius: 8px;
            border: 1px solid #2d2d2d;
            overflow: hidden;
        }

        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 12px 20px; border-bottom: 1px solid #2d2d2d; }
        th { background: #151515; color: #aaa; font-weight: 600; }
        
        .type-purchase { color: #2ecc71; font-weight: bold; }
        .type-sale { color: #3498db; font-weight: bold; }
    </style>
</head>
<body>

    <h2>Учёт товаров</h2>

    <div class="top-container">
        <div class="stats">
            <div class="card"><div>Потрачено</div><h3 id="total-spent">0 ₽</h3></div>
            <div class="card"><div>Продано</div><h3 id="total-sold">0 ₽</h3></div>
            <div class="card"><div>Прибыль</div><h3 id="total-profit">0 ₽</h3></div>
        </div>

        <div class="calc-card">
            <div class="calc-title">Калькулятор % (Скидка)</div>
            <div class="calc-inputs">
                <input type="number" id="calcPrice" placeholder="Цена">
                <span>-</span>
                <input type="number" id="calcPercent" placeholder="%">
                <span>%</span>
            </div>
            <div class="calc-result" id="calcResult">Итог: 0 ₽</div>
        </div>
    </div>

    <div class="controls-group">
        <div class="form-group">
            <input type="text" id="itemName" placeholder="Название товара">
            <input type="number" id="itemPrice" placeholder="Цена (₽)">
            <select id="itemType">
                <option value="Покупка">Покупка</option>
                <option value="Продажа">Продажа</option>
            </select>
            <button id="addBtn">Добавить</button>
        </div>

        <div class="backup-group">
            <button class="backup-btn" id="downloadBtn">Скачать копию</button>
            <button class="backup-btn" id="uploadBtn">Загрузить копию</button>
            <input type="file" id="backupFileInput" accept=".json">
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Товар</th>
                    <th>Тип</th>
                    <th>Время</th>
                    <th>Сумма</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody id="table-body">
                <!-- Строки добавляются через JS -->
            </tbody>
        </table>
    </div>

    <script>
        // Полностью безопасное чтение и сброс поврежденной памяти
        let items = [];
        try {
            const savedData = localStorage.getItem('accounting_items');
            if (savedData) {
                const parsed = JSON.parse(savedData);
                if (Array.isArray(parsed)) {
                    items = parsed;
                } else {
                    localStorage.removeItem('accounting_items');
                }
            }
        } catch (e) {
            items = [];
            localStorage.setItem('accounting_items', '[]');
        }

        // Защищенный калькулятор без inline-атрибутов
        function calculatePercent() {
            const priceVal = document.getElementById('calcPrice').value;
            const percentVal = document.getElementById('calcPercent').value;
            const resultEl = document.getElementById('calcResult');
            
            if (!resultEl) return;

            const price = parseFloat(priceVal) || 0;
            const percent = parseFloat(percentVal) || 0;
            
            if (price > 0) {
                const discount = (price * Math.abs(percent)) / 100;
                const total = price - discount;
                resultEl.innerText = "Итог: " + Math.round(total) + " ₽";
            } else {
                resultEl.innerText = 'Итог: 0 ₽';
            }
        }

        // Привязываем события калькулятора через слушатели
        document.getElementById('calcPrice').addEventListener('input', calculatePercent);
        document.getElementById('calcPercent').addEventListener('input', calculatePercent);

        function saveToStorage() {
            localStorage.setItem('accounting_items', JSON.stringify(items));
        }

        function render() {
            const tableBody = document.getElementById('table-body');
            if (!tableBody) return;
            tableBody.innerHTML = '';

            let spent = 0;
            let sold = 0;

            items.forEach((item) => {
                if (!item || typeof item.price !== 'number') return;

                if (item.type === 'Покупка') spent += item.price;
                else sold += item.price;

                // Создаем строку таблицы
                const tr = document.createElement('tr');

                // Заполняем ячейки текстом
                const tdName = document.createElement('td');
                tdName.textContent = item.name || '';
                tr.appendChild(tdName);

                const tdType = document.createElement('td');
                tdType.textContent = item.type || '';
                tdType.className = item.type === 'Покупка' ? 'type-purchase' : 'type-sale';
                tr.appendChild(tdType);

                const tdTime = document.createElement('td');
                tdTime.textContent = item.time || '';
                tdTime.style.color = '#888';
                tdTime.style.fontSize = '14px';
                tr.appendChild(tdTime);

                const tdPrice = document.createElement('td');
                tdPrice.textContent = Math.round(item.price) + " ₽";
                tr.appendChild(tdPrice);

                // Безопасное создание кнопки удаления с привязкой клика из JS
                const tdActions = document.createElement('td');
                const delBtn = document.createElement('button');
                delBtn.textContent = 'Удалить';
                delBtn.className = 'delete-btn';
                delBtn.addEventListener('click', function() {
                    deleteItem(item.id);
                });
                tdActions.appendChild(delBtn);
                tr.appendChild(tdActions);

                tableBody.appendChild(tr);
            });

            document.getElementById('total-spent').innerText = Math.round(spent) + " ₽";
            document.getElementById('total-sold').innerText = Math.round(sold) + " ₽";
            
            const profit = sold - spent;
            const profitEl = document.getElementById('total-profit');
            if (profitEl) {
                profitEl.innerText = Math.round(profit) + " ₽";
                profitEl.style.color = profit >= 0 ? '#2ecc71' : '#e74c3c';
            }
        }

        // Привязываем клик кнопки «Добавить» напрямую
        document.getElementById('addBtn').addEventListener('click', function() {
