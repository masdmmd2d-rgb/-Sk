<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Учёт товаров</title>
    <style>
        body { 
            margin: 0;
            padding: 20px;
            background-color: #121212;
            color: #fff; 
            font-family: sans-serif; 
            min-height: 100vh;
            box-sizing: border-box;
        }

        h2 { margin-top: 0; }

        .top-container {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .stats { display: flex; gap: 20px; flex-wrap: wrap; }
        
        .card { 
            background: #1e1e1e; 
            padding: 15px 25px; 
            border-radius: 8px; 
            min-width: 150px; 
            border: 1px solid #2d2d2d;
        }
        .card div { font-size: 14px; color: #aaa; margin-bottom: 5px; }
        .card h3 { margin: 0; font-size: 24px; font-weight: bold; }

        .calc-card {
            background: #1e1e1e;
            padding: 15px 20px;
            border-radius: 8px;
            border: 1px solid #2d2d2d;
            min-width: 300px;
            flex: 1;
            max-width: 450px;
        }
        .calc-title { font-size: 14px; color: #aaa; margin-bottom: 10px; font-weight: bold; }
        .calc-inputs { display: flex; gap: 8px; align-items: center; }
        .calc-inputs input { width: 80px; }
        .calc-result { margin-top: 10px; font-size: 15px; color: #e74c3c; font-weight: bold; min-height: 18px; }

        .controls-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .form-group { display: flex; gap: 10px; flex-wrap: wrap; }
        .backup-group { display: flex; gap: 10px; flex-wrap: wrap; }
        
        input, select { 
            background: #1e1e1e; 
            border: 1px solid #444; 
            color: #fff; 
            padding: 8px 12px; 
            border-radius: 6px; 
            outline: none;
        }
        input:focus, select:focus { border-color: #2ecc71; }

        button { 
            background: #2ecc71; 
            border: none; 
            color: white; 
            padding: 8px 16px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold;
        }
        button:hover { background: #27ae60; }
        
        button.backup-btn { background: #34495e; }
        button.backup-btn:hover { background: #2c3e50; }

        button.delete-btn { 
            background: rgba(231, 76, 60, 0.1); 
            border: 1px solid #e74c3c;
            color: #e74c3c;
            padding: 4px 10px; 
            font-size: 13px; 
            border-radius: 4px;
            cursor: pointer;
        }
        button.delete-btn:hover { background: #e74c3c; color: white; }

        #backupFileInput { display: none; }

        .table-container {
            background: #1e1e1e;
            border-radius: 8px;
            border: 1px solid #2d2d2d;
            overflow: hidden;
        }

        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 12px 20px; border-bottom: 1px solid #2d2d2d; }
        th { background: #151515; color: #aaa; font-weight: 600; }
        
        .type-purchase { color: #2ecc71; font-weight: bold; }
        .type-sale { color: #3498db; font-weight: bold; }
    </style>
</head>
<body>

    <h2>Учёт товаров</h2>

    <div class="top-container">
        <div class="stats">
            <div class="card"><div>Потрачено</div><h3 id="total-spent">0 ₽</h3></div>
            <div class="card"><div>Продано</div><h3 id="total-sold">0 ₽</h3></div>
            <div class="card"><div>Прибыль</div><h3 id="total-profit">0 ₽</h3></div>
        </div>

        <div class="calc-card">
            <div class="calc-title">Калькулятор % (Скидка)</div>
            <div class="calc-inputs">
                <input type="number" id="calcPrice" placeholder="Цена" oninput="calculatePercent()">
                <span>-</span>
                <input type="number" id="calcPercent" placeholder="%" oninput="calculatePercent()">
                <span>%</span>
            </div>
            <div class="calc-result" id="calcResult">Итог: 0 ₽</div>
        </div>
    </div>

    <div class="controls-group">
        <div class="form-group">
            <input type="text" id="itemName" placeholder="Название товара">
            <input type="number" id="itemPrice" placeholder="Цена (₽)">
            <select id="itemType">
                <option value="Покупка">Покупка</option>
                <option value="Продажа">Продажа</option>
            </select>
            <button onclick="addItem()">Добавить</button>
        </div>

        <div class="backup-group">
            <button class="backup-btn" onclick="downloadBackup()">Скачать копию</button>
            <button class="backup-btn" onclick="document.getElementById('backupFileInput').click()">Загрузить копию</button>
            <input type="file" id="backupFileInput" accept=".json" onchange="uploadBackup(event)">
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Товар</th>
                    <th>Тип</th>
                    <th>Время</th>
                    <th>Сумма</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody id="table-body">
                <!-- Строки добавляются через JS -->
            </tbody>
        </table>
    </div>

    <script>
        let items = [];
        try {
            const savedData = localStorage.getItem('accounting_items');
            if (savedData) {
                items = JSON.parse(savedData) || [];
            }
        } catch (e) {
            items = [];
        }

        function calculatePercent() {
            const price = parseFloat(document.getElementById('calcPrice').value) || 0;
            const percent = parseFloat(document.getElementById('calcPercent').value) || 0;
            
            if (price > 0) {
                const discount = (price * Math.abs(percent)) / 100;
                const total = price - discount;
                document.getElementById('calcResult').innerText = `Итог: ${total.toLocaleString('ru-RU')} ₽`;
            } else {
                document.getElementById('calcResult').innerText = 'Итог: 0 ₽';
            }
        }

        function saveToStorage() {
            localStorage.setItem('accounting_items', JSON.stringify(items));
        }

        function render() {
            const tableBody = document.getElementById('table-body');
            if (!tableBody) return;
            tableBody.innerHTML = '';

            let spent = 0;
            let sold = 0;

            items.forEach((item) => {
                if (!item || typeof item.price !== 'number') return;

                if (item.type === 'Покупка') spent += item.price;
                else sold += item.price;

                tableBody.innerHTML += `
                    <tr>
                        <td>${item.name || ''}</td>
                        <td class="${item.type === 'Покупка' ? 'type-purchase' : 'type-sale'}">${item.type || ''}</td>
                        <td style="color: #888; font-size: 14px;">${item.time || ''}</td>
                        <td>${item.price.toLocaleString('ru-RU')} ₽</td>
                        <td>
                            <button class="delete-btn" onclick="deleteItem(${item.id})">Удалить</button>
                        </td>
                    </tr>
                `;
            });

            document.getElementById('total-spent').innerText = `${spent.toLocaleString('ru-RU')} ₽`;
            document.getElementById('total-sold').innerText = `${sold.toLocaleString('ru-RU')} ₽`;
            
            const profit = sold - spent;
            const profitEl = document.getElementById('total-profit');
            if (profitEl) {
                profitEl.innerText = `${profit.toLocaleString('ru-RU')} ₽`;
                profitEl.style.color = profit >= 0 ? '#2ecc71' : '#e74c3c';
            }
        }

        function addItem() {
            const nameInput = document.getElementById('itemName');
            const priceInput = document.getElementById('itemPrice');
            const typeSelect = document.getElementById('itemType');

            if (!nameInput.value || !priceInput.value) {
                alert('Заполните все поля!');
                return;
            }

            const now = new Date();
            const timeString = now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

            items.unshift({ // unshift добавляет новые операции наверх списка
                id: Date.now(), 
                name: nameInput.value,
                price: parseFloat(priceInput.value),
                type: typeSelect.value,
                time: timeString
            });

            saveToStorage();
            render();

            nameInput.value = '';
            priceInput.value = '';
        }

        window.deleteItem = function(id) {
            items = items.filter(item => item && item.id !== id);
            saveToStorage();
            render();
        }

        function downloadBackup() {
            if (items.length === 0) return alert('Таблица пуста!');
            const blob = new Blob([JSON.stringify(items, null, 2)], { type: "application/json" });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "uchet_tovarov_backup.json";
            link.click();
        }

        function uploadBackup(event) {
            const file = event.target.files;
