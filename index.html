<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Расходы и доходы</title>
    <style>
        body { 
            margin: 0;
            padding: 24px;
            background-color: #0b0d13;
            color: #f1f2f6; 
            font-family: system-ui, -apple-system, sans-serif; 
            min-height: 100vh;
            box-sizing: border-box;
        }

        h2 { margin-top: 0; }

        /* Шапка */
        .header-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .header-title {
            font-size: 18px;
            font-weight: 600;
            color: #9ca3af;
        }

        .add-op-btn {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }
        .add-op-btn:hover { background-color: #2563eb; }

        /* Карточки статистики */
        .stats { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
            gap: 20px; 
            margin-bottom: 24px; 
        }
        
        .card { 
            background: #141722; 
            padding: 24px; 
            border-radius: 12px; 
            border: 1px solid #1f2434;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .card-icon-box {
            width: 52px;
            height: 52px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }
        .icon-spent { background-color: rgba(239, 68, 68, 0.15); }
        .icon-sold { background-color: rgba(16, 185, 129, 0.15); }
        .icon-profit { background-color: rgba(59, 130, 246, 0.15); }

        .card-info div { font-size: 13px; color: #9ca3af; margin-bottom: 4px; }
        .card h3 { margin: 0; font-size: 28px; font-weight: 700; color: #f1f2f6; }
        #total-profit { color: #10b981; }

        /* Панель фильтров */
        .filters-panel {
            background: #141722;
            border: 1px solid #1f2434;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 24px;
        }

        .filter-item { display: flex; flex-direction: column; gap: 8px; }
        .filter-item label { font-size: 13px; color: #9ca3af; }

        /* Базовые стили полей */
        select, input[type="text"], input[type="number"], textarea { 
            background: #1a1e2d; 
            border: 1px solid #282f46; 
            color: #f1f2f6; 
            padding: 12px 16px; 
            border-radius: 8px; 
            outline: none;
            font-size: 14px;
            box-sizing: border-box;
            font-family: inherit;
        }
        select:focus, input:focus, textarea:focus { border-color: #3b82f6; }

        /* СТИЛИ ДЛЯ МОДАЛЬНОГО ОКНА КАК НА СКРИНШОТЕ */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-window {
            background: #141722;
            border: 1px solid #1f2434;
            border-radius: 16px;
            width: 100%;
            max-width: 500px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 18px;
            font-weight: 600;
        }
        .modal-close-x {
            cursor: pointer;
            font-size: 20px;
            color: #6b7280;
            background: none;
            border: none;
        }
        .modal-close-x:hover { color: #fff; }

        .modal-block {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .modal-block label {
            font-size: 14px;
            font-weight: 600;
            color: #9ca3af;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .modal-row-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        textarea {
            width: 100%;
            height: 100px;
            resize: none;
        }
        .hint-text {
            font-size: 12px;
            color: #4b5563;
            margin-top: -4px;
        }

        .modal-submit-btn {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 15px;
            margin-top: 10px;
        }
        .modal-submit-btn:hover { background-color: #2563eb; }

        /* История */
        .history-container {
            background: #141722;
            border: 1px solid #1f2434;
            border-radius: 12px;
            padding: 24px;
        }

        .history-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #f1f2f6;
        }

        .op-list { display: flex; flex-direction: column; gap: 12px; }
        
        .op-row {
            background: #1a1e2d;
            border: 1px solid #232a3f;
            border-radius: 10px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .op-main { display: flex; align-items: center; gap: 16px; }
        
        .op-icon {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .op-details { display: flex; flex-direction: column; gap: 4px; }
        .op-name { font-weight: 600; font-size: 15px; color: #f1f2f6; white-space: pre-line; }
        .op-time { font-size: 12px; color: #6b7280; }

        .op-right { display: flex; align-items: center; gap: 24px; }
        .op-amount { font-size: 16px; font-weight: 700; text-align: right; }
        .op-subtext { font-size: 11px; color: #6b7280; font-weight: normal; margin-top: 2px; }
        
        .row-purchase .op-icon { background: rgba(239, 68, 68, 0.15); }
        .row-purchase .op-amount { color: #ef4444; }
        
        .row-sale .op-icon { background: rgba(16, 185, 129, 0.15); }
        .row-sale .op-amount { color: #10b981; }

        .trash-btn {
            background: none;
            border: none;
            color: #4b5563;
            font-size: 16px;
            cursor: pointer;
            padding: 4px;
            transition: color 0.2s;
        }
        .trash-btn:hover { color: #ef4444; }

        /* Калькулятор */
        .calc-section {
            background: #141722;
            border: 1px solid #1f2434;
            border-radius: 12px;
            padding: 20px;
            margin-top: 24px;
        }
    </style>
</head>
<body>

    <div class="header-panel">
        <div class="header-title">💼 Расходы и доходы</div>
        <button class="add-op-btn" onclick="openModal()">+ Добавить операцию</button>
    </div>

    <div class="stats">
        <div class="card">
            <div class="card-icon-box icon-spent">🛒</div>
            <div class="card-info"><div>Потрачено</div><h3 id="total-spent">0 ₽</h3></div>
        </div>
        <div class="card">
            <div class="card-icon-box icon-sold">📈</div>
            <div class="card-info"><div>Продано</div><h3 id="total-sold">0 ₽</h3></div>
        </div>
        <div class="card">
            <div class="card-icon-box icon-profit">💼</div>
            <div class="card-info"><div>Прибыль</div><h3 id="total-profit">0 ₽</h3></div>
        </div>
    </div>

    <div class="filters-panel">
        <div class="filter-item">
            <label>🔍 Тип операции</label>
            <select id="filterType" onchange="render()">
                <option value="Все">Все операции</option>
                <option value="Покупка">Покупка</option>
                <option value="Продажа">Продажа</option>
            </select>
        </div>
    </div>

    <!-- НОВОЕ КРАСИВОЕ МОДАЛЬНОЕ ОКНО ИЗ СКРИНШОТА -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeModalOnOverlay(event)">
        <div class="modal-window">
            <div class="modal-header">
                <div><span>➕</span> Добавить операцию</div>
                <button class="modal-close-x" onclick="closeModal()">×</button>
            </div>

            <div class="modal-block">
                <label><span>📝</span> Описание операции</label>
                <textarea id="itemDesc" placeholder="Зимние коробы х100 штук&#10;Куплено на Свалке&#10;Для перепродажи"></textarea>
                <div class="hint-text">Опишите операцию подробно (можно в несколько строк)</div>
            </div>

            <div class="modal-block">
                <label><span>🔄</span> Тип операции</label>
                <select id="itemType" style="width: 100%;">
                    <option value="Покупка">Покупка</option>
                    <option value="Продажа">Продажа</option>
                </select>
            </div>

            <div class="modal-row-inputs">
                <div class="modal-block">
                    <label><span>📦</span> Количество</label>
