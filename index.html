<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Учёт товаров</title>
    <style>
        body { background-color: #121212; color: #fff; font-family: sans-serif; padding: 20px; }
        .stats { display: flex; gap: 20px; margin-bottom: 20px; }
        .card { background: #1e1e1e; padding: 15px 25px; border-radius: 8px; min-width: 150px; }
        .form-group { display: flex; gap: 10px; margin-bottom: 20px; align-items: center; }
        input, select { background: #222; border: 1px solid #444; color: #fff; padding: 8px; border-radius: 4px; }
        button { background: #2ecc71; border: none; color: white; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button.delete-btn { background: #e74c3c; padding: 4px 8px; font-size: 12px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #333; }
        .type-purchase { color: #2ecc71; font-weight: bold; }
        .type-sale { color: #3498db; font-weight: bold; }
    </style>
</head>
<body>

    <h2>Учёт товаров</h2>

    <!-- Карточки статистики -->
    <div class="stats">
        <div class="card"><div>Потрачено</div><h3 id="total-spent">0 ₽</h3></div>
        <div class="card"><div>Продано</div><h3 id="total-sold">0 ₽</h3></div>
        <div class="card"><div>Прибыль</div><h3 id="total-profit">0 ₽</h3></div>
    </div>

    <!-- Форма добавления и новый фильтр операций -->
    <div class="form-group">
        <input type="text" id="itemName" placeholder="Название товара">
        <input type="number" id="itemPrice" placeholder="Цена (₽)">
        <select id="itemType">
            <option value="Покупка">Покупка</option>
            <option value="Продажа">Продажа</option>
        </select>
        <button onclick="addItem()">Добавить</button>

        <!-- Фильтр операций со скриншота -->
        <span style="margin-left: 20px; color: #aaa; font-size: 14px;">⏳ Фильтр:</span>
        <select id="filterType" onchange="render()" style="border-color: #3498db;">
            <option value="Все">Все операции</option>
            <option value="Покупка">Покупка</option>
            <option value="Продажа">Продажа</option>
        </select>
    </div>

    <!-- Таблица -->
    <table>
        <thead>
            <tr>
                <th>Товар</th>
                <th>Тип</th>
                <th>Время</th>
                <th>Сумма</th>
                <th>Действия</th>
            </tr>
        </thead>
        <tbody id="table-body">
            <!-- Сюда JS добавляет строки -->
        </tbody>
    </table>

    <script>
        let items = [];
        try {
            const savedData = localStorage.getItem('accounting_items');
            if (savedData) { items = JSON.parse(savedData) || []; }
        } catch (e) { items = []; }

        function saveToStorage() {
            localStorage.setItem('accounting_items', JSON.stringify(items));
        }

        function render() {
            const tableBody = document.getElementById('table-body');
            if (!tableBody) return;
            tableBody.innerHTML = '';

            let spent = 0;
            let sold = 0;

            const currentFilter = document.getElementById('filterType').value;

            items.forEach((item) => {
                if (!item || typeof item.price !== 'number') return;

                if (item.type === 'Покупка') { spent += item.price; } else { sold += item.price; }

                // Фильтрация строк на лету
                if (currentFilter !== 'Все' && item.type !== currentFilter) {
                    return;
                }

                tableBody.innerHTML += `
                    <tr>
                        <td>${item.name || ''}</td>
                        <td class="${item.type === 'Покупка' ? 'type-purchase' : 'type-sale'}">${item.type || ''}</td>
                        <td style="color: #888; font-size: 14px;">${item.time || ''}</td>
                        <td>${item.price.toFixed(0)} ₽</td>
                        <td>
                            <button class="delete-btn" onclick="deleteItem(${item.id})">Удалить</button>
                        </td>
                    </tr>
                `;
            });

            document.getElementById('total-spent').innerText = spent.toFixed(0) + " ₽";
            document.getElementById('total-sold').innerText = sold.toFixed(0) + " ₽";
            
            const profit = sold - spent;
            const profitEl = document.getElementById('total-profit');
            if (profitEl) {
                profitEl.innerText = profit.toFixed(0) + " ₽";
                profitEl.style.color = profit >= 0 ? '#2ecc71' : '#e74c3c';
            }
        }

        function addItem() {
            const nameInput = document.getElementById('itemName');
            const priceInput = document.getElementById('itemPrice');
            const typeSelect = document.getElementById('itemType');

            if (!nameInput.value || !priceInput.value) {
                alert('Заполните все поля!');
                return;
            }

            const now = new Date();
            const timeString = now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

            items.unshift({
                id: Date.now(),
                name: nameInput.value,
                price: parseFloat(priceInput.value) || 0,
                type: typeSelect.value,
                time: timeString
            });

            saveToStorage();
            render();

            nameInput.value = '';
            priceInput.value = '';
        }

        window.deleteItem = function(id) {
            items = items.filter(item => item && item.id !== id);
            saveToStorage();
            render();
        }

        render();
    </script>
</body>
</html>
