<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Расходы и доходы</title>
    <!-- Подключаем библиотеку иконок Font Awesome -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        body { 
            margin: 0;
            padding: 24px;
            background-color: #0b0d13;
            color: #f1f2f6; 
            font-family: system-ui, -apple-system, sans-serif; 
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* Верхняя панель заголовка */
        .header-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .header-title {
            font-size: 18px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #9ca3af;
        }

        /* Кнопка «Добавить операцию» */
        .add-op-btn {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
        }
        .add-op-btn:hover { background-color: #2563eb; }

        /* Панель больших карточек статистики */
        .stats { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
            gap: 20px; 
            margin-bottom: 24px; 
        }
        
        .card { 
            background: #141722; 
            padding: 24px; 
            border-radius: 12px; 
            border: 1px solid #1f2434;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .card-icon-box {
            width: 52px;
            height: 52px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            background: rgba(255, 255, 255, 0.03);
        }

        /* Кастомные цвета иконок */
        .icon-spent { color: #ef4444; background: rgba(239, 68, 68, 0.1); }
        .icon-sold { color: #10b981; background: rgba(16, 185, 129, 0.1); }
        .icon-profit { color: #3b82f6; background: rgba(59, 130, 246, 0.1); }

        .card-info div { font-size: 13px; color: #9ca3af; margin-bottom: 4px; }
        .card h3 { margin: 0; font-size: 28px; font-weight: 700; }
        
        #total-spent { color: #f1f2f6; }
        #total-sold { color: #f1f2f6; }
        #total-profit { color: #10b981; }

        /* Блок фильтров */
        .filters-panel {
            background: #141722;
            border: 1px solid #1f2434;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 24px;
            display: flex;
            gap: 40px;
        }

        .filter-item { display: flex; flex-direction: column; gap: 8px; }
        .filter-item label { font-size: 13px; color: #9ca3af; display: flex; align-items: center; gap: 6px; }

        /* Красивые кастомные выпадающие списки */
        select, input[type="text"], input[type="number"] { 
            background: #1a1e2d; 
            border: 1px solid #282f46; 
            color: #f1f2f6; 
            padding: 10px 16px; 
            border-radius: 8px; 
            outline: none;
            font-size: 14px;
            min-width: 180px;
            transition: border-color 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }
        select:focus, input:focus { 
            border-color: #3b82f6; 
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.2);
        }

        /* Форма добавления */
        .form-popup {
            background: #141722;
            border: 1px solid #1f2434;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 24px;
            display: none;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }

        /* Список операций */
        .history-container {
            background: #141722;
            border: 1px solid #1f2434;
            border-radius: 12px;
            padding: 24px;
        }

        .history-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #f1f2f6;
        }

        /* Строки списка */
        .op-list { display: flex; flex-direction: column; gap: 12px; }
        
        .op-row {
            background: #1a1e2d;
            border: 1px solid #232a3f;
            border-radius: 10px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: transform 0.2s, border-color 0.2s;
        }
        .op-row:hover {
            border-color: #2e3754;
            transform: translateX(2px);
        }

        .op-main { display: flex; align-items: center; gap: 16px; }
        
        .op-icon {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .op-details { display: flex; flex-direction: column; gap: 4px; }
        .op-name { font-weight: 600; font-size: 15px; color: #f1f2f6; }
        .op-time { font-size: 12px; color: #6b7280; }

        .op-right { display: flex; align-items: center; gap: 24px; }
        .op-amount { font-size: 16px; font-weight: 700; }
        
        /* Стили для типов операций */
        .row-purchase .op-icon { color: #ef4444; background: rgba(239, 68, 68, 0.1); }
        .row-purchase .op-amount { color: #ef4444; }
        
        .row-sale .op-icon { color: #10b981; background: rgba(16, 185, 129, 0.1); }
        .row-sale .op-amount { color: #10b981; }

        /* Кнопка удаления */
        .trash-btn {
            background: none;
            border: none;
            color: #4b5563;
            font-size: 16px;
            cursor: pointer;
            padding: 4px;
            transition: color 0.2s;
        }
        .trash-btn:hover { color: #ef4444; }

        /* Калькулятор */
        .calc-section {
            background: #141722;
            border: 1px solid #1f2434;
            border-radius: 12px;
            padding: 20px;
            margin-top: 24px;
        }
    </style>
</head>
<body>

    <!-- Верхняя шапка -->
    <div class="header-panel">
        <div class="header-title">
            <i class="fa-solid fa-wallet"></i> Расходы и доходы
        </div>
        <button class="add-op-btn" onclick="toggleForm()">
            <i class="fa-solid fa-plus"></i> Добавить операцию
        </button>
    </div>

    <!-- Карточки статистики -->
    <div class="stats">
        <div class="card">
            <div class="card-icon-box icon-spent"><i class="fa-solid fa-cart-shopping"></i></div>
            <div class="card-info"><div>Потрачено</div><h3 id="total-spent">0 ₽</h3></div>
        </div>
        <div class="card">
            <div class="card-icon-box icon-sold"><i class="fa-solid fa-arrow-trend-up"></i></div>
            <div class="card-info"><div>Продано</div><h3 id="total-sold">0 ₽</h3></div>
        </div>
        <div class="card">
            <div class="card-icon-box icon-profit"><i class="fa-solid fa-wallet"></i></div>
            <div class="card-info"><div>Прибыль</div><h3 id="total-profit">0 ₽</h3></div>
        </div>
    </div>

    <!-- Панель фильтров -->
    <div class="filters-panel">
        <div class="filter-item">
            <label><i class="fa-solid fa-filter"></i> Тип</label>
            <select id="filterType" onchange="render()">
                <option value="Все">Все операции</option>
                <option value="Покупка">Покупка</option>
                <option value="Продажа">Продажа</option>
            </select>
        </div>
    </div>

    <!-- Форма добавления -->
    <div class="form-popup" id="opForm">
        <input type="text" id="itemName" placeholder="Название предмета/чертежа">
        <input type="number" id="itemPrice" placeholder="Сумма (₽)">
        <select id="itemType">
            <option value="Покупка">Покупка</option>
            <option value="Продажа">Продажа</option>
        </select>
        <button onclick="addItem()">Добавить</button>
    </div>

    <!-- История операций -->
    <div class="history-container">
        <div class="history-title">
            <i class="fa-solid fa-list-ul"></i> История операций
        </div>
        <div class="op-list" id="table-body">
            <!-- Строки добавляются через JS -->
        </div>
    </div>

    <!-- Калькулятор -->
    <div class="calc-section">
        <div class="calc-title" style="font-size:14px; color:#9ca3af; margin-bottom:12px; font-weight:600;">Быстрый калькулятор % скидки</div>
        <div style="display:flex; gap:10px; align-items:center;">
            <input type="number" id="calcPrice" placeholder="Цена" oninput="calculatePercent()">
            <span>-</span>
            <input type="number" id="calcPercent" placeholder="%" oninput="calculatePercent()">
            <div class="calc-result" id="calcResult" style="margin-left:20px;">Итог: 0 ₽</div>
        </div>
    </div>

    <script>
        let items = [];
        try {
            const savedData = localStorage.getItem('accounting_items');
            if (savedData) { items = JSON.parse(savedData) || []; }
        } catch (e) { items = []; }

        function toggleForm() {
            const form = document.getElementById('opForm');
            form.style.display = form.style.display === 'flex' ? 'none' : 'flex';
        }
