<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Расходы и доходы</title>
    <style>
        body { 
            margin: 0;
            padding: 24px;
            background-color: #0b0d13;
            color: #f1f2f6; 
            font-family: system-ui, -apple-system, sans-serif; 
            min-height: 100vh;
            box-sizing: border-box;
        }

        h2 { margin-top: 0; }

        /* Шапка */
        .header-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .header-title {
            font-size: 18px;
            font-weight: 600;
            color: #9ca3af;
        }

        .add-op-btn {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }
        .add-op-btn:hover { background-color: #2563eb; }

        /* Карточки статистики */
        .stats { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
            gap: 20px; 
            margin-bottom: 24px; 
        }
        
        .card { 
            background: #141722; 
            padding: 24px; 
            border-radius: 12px; 
            border: 1px solid #1f2434;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .card-icon-box {
            width: 52px;
            height: 52px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }
        .icon-spent { background-color: rgba(239, 68, 68, 0.15); }
        .icon-sold { background-color: rgba(16, 185, 129, 0.15); }
        .icon-profit { background-color: rgba(59, 130, 246, 0.15); }

        .card-info div { font-size: 13px; color: #9ca3af; margin-bottom: 4px; }
        .card h3 { margin: 0; font-size: 28px; font-weight: 700; color: #f1f2f6; }
        #total-profit { color: #10b981; }

        /* Панель фильтров */
        .filters-panel {
            background: #141722;
            border: 1px solid #1f2434;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 24px;
        }

        .filter-item { display: flex; flex-direction: column; gap: 8px; }
        .filter-item label { font-size: 13px; color: #9ca3af; }

        /* Стили выпадающих списков и полей */
        select, input[type="text"], input[type="number"] { 
            background: #1a1e2d; 
            border: 1px solid #282f46; 
            color: #f1f2f6; 
            padding: 10px 16px; 
            border-radius: 8px; 
            outline: none;
            font-size: 14px;
            min-width: 180px;
            transition: border-color 0.2s;
        }
        select:focus, input:focus { border-color: #3b82f6; }

        /* Окно добавления */
        .form-popup {
            background: #141722;
            border: 1px solid #1f2434;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 24px;
            display: none;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }

        /* История */
        .history-container {
            background: #141722;
            border: 1px solid #1f2434;
            border-radius: 12px;
            padding: 24px;
        }

        .history-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #f1f2f6;
        }

        .op-list { display: flex; flex-direction: column; gap: 12px; }
        
        .op-row {
            background: #1a1e2d;
            border: 1px solid #232a3f;
            border-radius: 10px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .op-main { display: flex; align-items: center; gap: 16px; }
        
        .op-icon {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .op-details { display: flex; flex-direction: column; gap: 4px; }
        .op-name { font-weight: 600; font-size: 15px; color: #f1f2f6; }
        .op-time { font-size: 12px; color: #6b7280; }

        .op-right { display: flex; align-items: center; gap: 24px; }
        .op-amount { font-size: 16px; font-weight: 700; }
        
        .row-purchase .op-icon { background: rgba(239, 68, 68, 0.15); }
        .row-purchase .op-amount { color: #ef4444; }
        
        .row-sale .op-icon { background: rgba(16, 185, 129, 0.15); }
        .row-sale .op-amount { color: #10b981; }

        .trash-btn {
            background: none;
            border: none;
            color: #4b5563;
            font-size: 16px;
            cursor: pointer;
            padding: 4px;
            transition: color 0.2s;
        }
        .trash-btn:hover { color: #ef4444; }

        /* Калькулятор */
        .calc-section {
            background: #141722;
            border: 1px solid #1f2434;
            border-radius: 12px;
            padding: 20px;
            margin-top: 24px;
        }
    </style>
</head>
<body>

    <div class="header-panel">
        <div class="header-title">💼 Расходы и доходы</div>
        <button class="add-op-btn" onclick="toggleForm()">+ Добавить операцию</button>
    </div>

    <div class="stats">
        <div class="card">
            <div class="card-icon-box icon-spent">🛒</div>
            <div class="card-info"><div>Потрачено</div><h3 id="total-spent">0 ₽</h3></div>
        </div>
        <div class="card">
            <div class="card-icon-box icon-sold">📈</div>
            <div class="card-info"><div>Продано</div><h3 id="total-sold">0 ₽</h3></div>
        </div>
        <div class="card">
            <div class="card-icon-box icon-profit">💼</div>
            <div class="card-info"><div>Прибыль</div><h3 id="total-profit">0 ₽</h3></div>
        </div>
    </div>

    <div class="filters-panel">
        <div class="filter-item">
            <label>🔍 Тип операции</label>
            <select id="filterType" onchange="render()">
                <option value="Все">Все операции</option>
                <option value="Покупка">Покупка</option>
                <option value="Продажа">Продажа</option>
            </select>
        </div>
    </div>

    <div class="form-popup" id="opForm">
        <input type="text" id="itemName" placeholder="Название предмета">
        <input type="number" id="itemPrice" placeholder="Сумма (₽)">
        <select id="itemType">
            <option value="Покупка">Покупка</option>
            <option value="Продажа">Продажа</option>
        </select>
        <button onclick="addItem()">Добавить</button>
    </div>

    <div class="history-container">
        <div class="history-title">📊 История операций</div>
        <div class="op-list" id="table-body"></div>
    </div>

    <div class="calc-section">
        <div style="font-size:14px; color:#9ca3af; margin-bottom:12px; font-weight:600;">Быстрый калькулятор % скидки</div>
        <div style="display:flex; gap:10px; align-items:center;">
            <input type="number" id="calcPrice" placeholder="Цена" oninput="calculatePercent()">
            <span>-</span>
            <input type="number" id="calcPercent" placeholder="%" oninput="calculatePercent()">
            <div id="calcResult" style="margin-left:20px; font-weight:bold; color:#ef4444;">Итог: 0 ₽</div>
        </div>
    </div>

    <script>
        let items = [];
        try {
            const savedData = localStorage.getItem('accounting_items');
            if (savedData) { items = JSON.parse(savedData) || []; }
        } catch (e) { items = []; }

        function toggleForm() {
            const form = document.getElementById('opForm');
            if (form) {
                // Если форма скрыта или не имеет стиля - показываем, иначе скрываем
                if (form.style.display === 'none' || form.style.display === '') {
                    form.style.display = 'flex';
                } else {
                    form.style.display = 'none';
                }
            }
        }

        // БЕЗОПАСНЫЙ КАЛЬКУЛЯТОР: защищен от зависаний при любых огромных числах
        function calculatePercent() {
            try {
                const priceValue = document.getElementById('calcPrice').value;
                const percentValue = document.getElementById('calcPercent').value;
                const resultEl = document.getElementById('calcResult');
                
                if (!resultEl) return;

                const price = parseFloat(priceValue) || 0;
                const percent = parseFloat(percentValue) || 0;
                
                if (price > 0) {
                    const discount = (price * Math.abs(percent)) / 100;
                    const total = price - discount;
                    
                    // Обрезаем до 2 знаков после запятой, чтобы не ломать Chromium округлениями
                    resultEl.innerText = "Итог: " + total.toFixed(2) + " ₽ (скидка: -" + discount.toFixed(2) + " ₽)";
                } else { 
                    resultEl.innerText = 'Итог: 0 ₽'; 
                }
            } catch (err) {
                console.error(err);
            }
        }

        function saveToStorage() { localStorage.setItem('accounting_items', JSON.stringify(items)); }

        function formatPrice(num) {
            try {
                if (num >= 1000000000) return (num / 1000000000).toFixed(1) + ' млрд';
